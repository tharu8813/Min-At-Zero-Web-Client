<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>맵 목록 | Min. At. Zero Web Client</title>
  <meta name="description" content="Min. At. Zero 서버에서 플레이 가능한 다양한 전투 맵을 소개합니다.">
  <meta name="theme-color" content="#101513">
  <link rel="icon" type="image/png" href="asset/image/icon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&family=Share+Tech+Mono&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="asset/style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="asset/image/icon.png">
  <link rel="stylesheet" href="asset/theme.css">
  <link rel="stylesheet" href="asset/maps.css">
</head>

<body class="maps-page">
  <a class="skip-link" href="#page-content">본문으로 건너뛰기</a>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-radial" aria-hidden="true"></div>
  <div id="scroll-progress" aria-hidden="true"></div>

  <div class="wrap">
    <header id="header-root" class="header" aria-busy="true"><span class="skeleton loading-logo" aria-hidden="true"></span><span class="skeleton loading-brand" aria-hidden="true"></span><span class="skeleton loading-nav" aria-hidden="true"></span></header>

    <main id="page-content" tabindex="-1">
      <section class="page-hero" aria-labelledby="maps-title">
        <div>
          <p class="map-kicker">MIN. AT. ZERO / BATTLE MAPS</p>
          <h2 class="page-title" id="maps-title">다음 전장을 <span>둘러보세요.</span></h2>
          <p class="page-desc">전장마다 다른 풍경과 교전 환경을 미리 살펴보세요.</p>
        </div>
        <p class="map-total">등록된 전장 <strong id="map-count" class="skeleton-text">—</strong>개</p>
      </section>
      <section class="map-controls" aria-label="맵 검색과 필터">
        <div class="controls-bar">
          <div class="map-field">
            <label for="map-search">맵 찾기</label>
            <div class="map-search-wrap"><input class="map-search" id="map-search" type="search" placeholder="맵 이름 또는 제작자" data-map-control disabled><button class="map-clear" id="map-clear" aria-label="맵 검색 지우기" data-map-control hidden>×</button></div>
          </div>
          <div class="map-field"><label for="map-distance">교전 거리</label><select class="map-distance" id="map-distance" data-map-control disabled><option value="">모든 거리</option><option value="근거리">근거리</option><option value="중거리">중거리</option><option value="장거리">장거리</option></select></div>
          <div><span class="view-label">보기 방식</span><div class="view-switcher" role="group" aria-label="맵 보기 방식">
            <button class="view-btn active" id="btn-grid" type="button" aria-label="그리드 뷰" aria-pressed="true" data-map-control disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>갤러리</button>
            <button class="view-btn" id="btn-list" type="button" aria-label="리스트 뷰" aria-pressed="false" data-map-control disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>목록</button>
          </div></div>
        </div>
        <div class="map-filter-bar"><div class="map-modes" role="group" aria-label="게임 모드">
          <button class="map-mode" data-mode="" aria-pressed="true" data-map-control disabled>전체 전장</button>
          <button class="map-mode" data-mode="팀 데스매치" aria-pressed="false" data-map-control disabled>팀 데스매치</button>
          <button class="map-mode" data-mode="개인 데스매치" aria-pressed="false" data-map-control disabled>개인 데스매치</button>
        </div><p class="map-result skeleton-text" id="map-result" role="status">맵 목록</p></div>
      </section>
      <section aria-label="전장 목록">
        <div class="maps-grid" id="maps-container" aria-busy="true"><div class="card map-card skeleton" aria-hidden="true"><span class="map-thumb-wrap skeleton"></span><span class="skeleton"></span><span class="skeleton"></span></div><div class="card map-card skeleton" aria-hidden="true"><span class="map-thumb-wrap skeleton"></span><span class="skeleton"></span><span class="skeleton"></span></div><div class="card map-card skeleton" aria-hidden="true"><span class="map-thumb-wrap skeleton"></span><span class="skeleton"></span><span class="skeleton"></span></div></div>
        <div class="map-empty" id="map-empty" hidden><h3 id="map-empty-title">조건에 맞는 맵이 없습니다.</h3><p id="map-empty-description">다른 검색어를 입력하거나 필터를 바꿔 보세요.</p><button class="map-reset" id="map-reset" data-map-control>필터 초기화</button></div>
        <button class="map-retry" id="map-retry" hidden>맵 정보 다시 불러오기</button>
      </section>
      <p class="map-note">실제 플레이는 전용 클라이언트에서 진행됩니다. <a href="serverinfo.html#installation-card">설치와 접속 안내 →</a></p>
    </main>
    <footer id="footer-root" class="footer" aria-busy="true"><div class="wrap loading-lines" aria-hidden="true"><span class="skeleton"></span><span class="skeleton"></span><span class="skeleton"></span></div></footer>
  </div>

  <div class="map-modal-bg" id="map-modal" aria-hidden="true" inert>
    <div class="map-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal-close" id="modal-close" aria-label="맵 상세 닫기">×</button>
      <div class="modal-hero">
        <div class="modal-slider-wrapper" id="modal-slider"></div>
        <div class="modal-gallery-controls"><span class="modal-image-count" id="modal-image-count" aria-live="polite"></span><div class="slider-dots" id="slider-dots" role="group" aria-label="맵 이미지 선택"></div><button class="slider-btn" id="slider-prev" type="button" aria-label="이전 이미지">←</button><button class="slider-btn" id="slider-next" type="button" aria-label="다음 이미지">→</button></div>
      </div>
      <div class="modal-body">
        <p class="map-kicker">MAP DETAILS / 전장 정보</p>
        <h2 class="modal-title" id="modal-title"></h2><p class="modal-by" id="modal-by-label"></p>
        <dl class="modal-meta-grid">
          <div><dt class="meta-label">게임 모드</dt><dd class="meta-value" id="modal-mode"></dd></div>
          <div><dt class="meta-label">교전 거리</dt><dd class="meta-value" id="modal-distance"></dd></div>
          <div><dt class="meta-label">맵 크기</dt><dd class="meta-value" id="modal-size"></dd></div>
          <div><dt class="meta-label">등록일</dt><dd class="meta-value" id="modal-date"></dd></div>
        </dl>
        <p class="modal-desc" id="modal-desc"></p>
      </div>
    </div>
  </div>

  <script src="asset/script.js"></script>
  <script>
    (function () {
      const $ = id => document.getElementById(id);
      const container = $('maps-container');
      const modal = $('map-modal');
      const modalSlider = $('modal-slider');
      const sliderDots = $('slider-dots');
      const search = $('map-search');
      const distance = $('map-distance');
      const empty = $('map-empty');
      const retry = $('map-retry');
      const skeletons = container.innerHTML;
      const controls = [...document.querySelectorAll('[data-map-control]')];
      const esc = value => utils.sanitizeText(value);
      let maps = [], mapEntries = [], selectedMode = '', fetching = false;
      let currentSlide = 0, totalSlides = 0, imageCount = 0;
      let lastModalTrigger = null;

      function normalizeMap(map) {
        return { ...map,
          by: String(map.by ?? '출처 정보 없음'),
          value: String(map.value ?? '상세 설명이 등록되지 않았습니다.'),
          CombatDistance: String(map.CombatDistance ?? '거리 정보 없음'),
          createData: String(map.createData ?? '알 수 없음'),
          mode: String(map.gamemode ?? '').replace('게인', '개인').replace('데스메치', '데스매치'),
          size: String(map.mapSize ?? '알 수 없음').replace(/\s*[xX×]\s*/g, ' × '),
          image: Array.isArray(map.image) ? map.image.filter(src => typeof src === 'string' && /^map\/[\w/-]+\.(png|jpe?g|webp)$/i.test(src)) : [],
        };
      }

      function matchesMap(map, query, mode, range) {
        return (!mode || map.mode === mode)
          && (!range || map.CombatDistance.split(',').map(value => value.trim()).includes(range))
          && `${map.title} ${map.by}`.toLowerCase().includes(query.trim().toLowerCase());
      }

      function mediaMarkup(src, title, className, lazy = false) {
        return `<div class="img-skeleton" aria-hidden="true"></div>
          <img class="${className}" src="${esc(src)}" alt="${esc(title)}" loading="${lazy ? 'lazy' : 'eager'}" decoding="async"
            onload="this.classList.add('loaded');this.previousElementSibling.classList.add('hidden')"
            onerror="this.onerror=null;this.hidden=true;this.previousElementSibling.classList.add('hidden');this.nextElementSibling.hidden=false">
          <div class="map-thumb-placeholder" hidden><span aria-hidden="true">MAP / —</span>이미지를 불러오지 못했습니다.</div>`;
      }

      function applyFilters() {
        let shown = 0;
        mapEntries.forEach(({ map, card }) => {
          const visible = matchesMap(map, search.value, selectedMode, distance.value);
          card.hidden = !visible;
          if (visible) {
            shown++;
            card.classList.remove('motion-pending');
            card.classList.remove('motion-enter');
          }
        });
        $('map-result').textContent = `${shown}개 전장 · 전체 ${maps.length}개`;
        $('map-clear').hidden = !search.value;
        empty.hidden = shown > 0;
        $('map-empty-title').textContent = maps.length ? '조건에 맞는 맵이 없습니다.' : '등록된 맵이 없습니다.';
        $('map-empty-description').textContent = maps.length ? '다른 검색어를 입력하거나 필터를 바꿔 보세요.' : '새로운 전장이 등록되면 이곳에서 확인할 수 있습니다.';
        $('map-reset').hidden = !maps.length;
      }

      function resetFilters() {
        search.value = '';
        distance.value = '';
        selectedMode = '';
        document.querySelectorAll('.map-mode').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.mode === '')));
        applyFilters();
      }

      function renderMaps() {
        container.innerHTML = '';
        mapEntries = maps.map((map, i) => {
          const card = document.createElement('article');
          card.className = 'card map-card revealed';
          card.setAttribute('role', 'button');
          card.setAttribute('tabindex', '0');
          card.setAttribute('aria-label', `${map.title} 맵 상세 정보 보기`);
          card.setAttribute('aria-describedby', `map-summary-${i}`);
          card.innerHTML = `
            <div class="map-thumb-wrap">
              ${map.image.length ? mediaMarkup(map.image[0], map.title, 'map-thumb', i > 1) : '<div class="map-thumb-placeholder"><span aria-hidden="true">MAP / —</span>미리보기 이미지가 없습니다.</div>'}
              <span class="map-image-label">${map.image.length ? `<b>${map.image.length}</b>장의 미리보기` : '등록된 이미지 없음'}</span><span class="map-image-link" aria-hidden="true">↗</span>
            </div>
            <div class="map-info">
              <div class="map-title-row"><h3 class="map-card-title">${esc(map.title)}</h3><span class="map-mode-label">${esc(map.mode || '모드 정보 없음')}</span></div>
              <p class="map-card-by">제작·출처 ${esc(map.by)}</p>
              <p class="map-card-desc" id="map-summary-${i}">${esc(map.value)}</p>
              <dl class="map-card-meta"><div><dt>교전 거리</dt><dd>${esc(map.CombatDistance)}</dd></div><div><dt>맵 크기</dt><dd>${esc(map.size)}</dd></div></dl>
            </div>`;
          card.onclick = () => openModal(map, card);
          card.onkeydown = event => {
            if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); openModal(map, card); }
          };
          container.appendChild(card);
          return { map, card };
        });
        applyFilters();
      }

      /* ── 슬라이더 ── */
      function updateSlider() {
        modalSlider.querySelectorAll('.modal-slide').forEach((slide, i) => {
          slide.classList.toggle('is-active', i === currentSlide);
          slide.setAttribute('aria-hidden', String(i !== currentSlide));
        });
        sliderDots.querySelectorAll('.slider-dot').forEach((dot, i) => {
          dot.classList.toggle('active', i === currentSlide);
          dot.setAttribute('aria-current', String(i === currentSlide));
        });
        $('modal-image-count').textContent = imageCount ? `${currentSlide + 1} / ${imageCount}` : '미리보기 없음';
      }

      /* ── 뷰 전환 애니메이션 ── */
      let viewTransition;
      let viewIsList = false;
      function switchView(toList) {
        viewIsList = toList;
        const update = () => {
          if (toList !== viewIsList) return;
          container.querySelectorAll('.map-card').forEach(card => {
            card.classList.remove('motion-pending');
            card.classList.remove('motion-enter');
          });
          container.classList.toggle('view-list', toList);
        };
        viewTransition?.skipTransition();
        if (document.startViewTransition && !window.matchMedia('(prefers-reduced-motion: reduce)').matches && !document.documentElement.classList.contains('motion-off')) {
          document.documentElement.classList.add('map-view-transition');
          viewTransition = document.startViewTransition(update);
          viewTransition.ready.catch(error => { if (error.name !== 'AbortError') console.error(error); });
          const transition = viewTransition;
          transition.finished.then(() => {
            if (viewTransition === transition) document.documentElement.classList.remove('map-view-transition');
          });
        } else {
          document.documentElement.classList.remove('map-view-transition');
          update();
        }
      }


      /* ── 맵 로드 ── */
      async function loadMaps() {
        if (fetching) return;
        fetching = true;
        controls.forEach(control => { control.disabled = true; });
        retry.hidden = true;
        empty.hidden = true;
        loading.begin(container, skeletons);
        loading.begin($('map-count'));
        loading.begin($('map-result'));
        let loaded = false;
        try {
          const res = await fetch('./map/map.json', { signal: AbortSignal.timeout(10_000) });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          if (!Array.isArray(data)) throw new Error('Invalid map data');
          maps = [...data].reverse().filter(map => map && typeof map.title === 'string' && map.title.trim()).map(normalizeMap);
          $('map-count').textContent = maps.length;
          renderMaps();
          loaded = true;
        } catch (error) {
          maps = []; mapEntries = [];
          container.innerHTML = '<div class="map-empty" role="alert"><h3>맵 정보를 불러오지 못했습니다.</h3><p>잠시 후 다시 시도해 주세요.</p></div>';
          $('map-count').textContent = '—';
          $('map-result').textContent = '불러오기 실패';
          retry.hidden = false;
        } finally {
          fetching = false;
          loading.end(container);
          loading.end($('map-count'));
          loading.end($('map-result'));
          controls.forEach(control => { control.disabled = !loaded; });
        }
      }

      /* ── 모달 열기 ── */
      function openModal(map, trigger) {
        lastModalTrigger = trigger;
        currentSlide = 0;
        imageCount = map.image.length;
        totalSlides = Math.max(imageCount, 1);
        modalSlider.innerHTML = imageCount ? map.image.map(src => `<div class="modal-slide">${mediaMarkup(src, map.title, 'modal-image')}</div>`).join('')
          : '<div class="modal-slide"><div class="map-thumb-placeholder"><span aria-hidden="true">MAP / —</span>미리보기 이미지가 없습니다.</div></div>';
        sliderDots.innerHTML = map.image.map((_, i) => `<button type="button" class="slider-dot" data-i="${i}" aria-label="${i + 1}번째 이미지 보기">${i + 1}</button>`).join('');
        sliderDots.querySelectorAll('.slider-dot').forEach(dot => {
          dot.onclick = () => { currentSlide = Number(dot.dataset.i); updateSlider(); };
        });
        $('modal-title').textContent = map.title;
        $('modal-by-label').textContent = '제작·출처 ' + map.by;
        $('modal-mode').textContent = map.mode || '모드 정보 없음';
        $('modal-distance').textContent = map.CombatDistance;
        $('modal-size').textContent = map.size;
        $('modal-date').textContent = map.createData;
        $('modal-desc').textContent = map.value;
        $('slider-prev').disabled = imageCount <= 1;
        $('slider-next').disabled = imageCount <= 1;
        ['header-root', 'page-content', 'footer-root'].forEach(id => { $(id).inert = true; });
        modal.classList.add('active');
        modal.inert = false;
        modal.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
        updateSlider();
        requestAnimationFrame(() => $('modal-close').focus());
      }

      function closeModal() {
        modal.classList.remove('active');
        modal.inert = true;
        modal.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
        ['header-root', 'page-content', 'footer-root'].forEach(id => { $(id).inert = false; });
        if (lastModalTrigger instanceof HTMLElement) lastModalTrigger.focus();
      }

      /* ── 이벤트 ── */
      search.addEventListener('input', applyFilters);
      distance.addEventListener('change', applyFilters);
      $('map-clear').onclick = () => { search.value = ''; applyFilters(); search.focus(); };
      $('map-reset').onclick = resetFilters;
      retry.onclick = loadMaps;
      document.querySelectorAll('.map-mode').forEach(button => {
        button.onclick = () => {
          selectedMode = button.dataset.mode;
          document.querySelectorAll('.map-mode').forEach(item => item.setAttribute('aria-pressed', String(item === button)));
          applyFilters();
        };
      });
      $('modal-close').onclick = closeModal;
      modal.addEventListener('click', event => { if (event.target === modal) closeModal(); });
      $('slider-prev').onclick = () => { currentSlide = (currentSlide - 1 + totalSlides) % totalSlides; updateSlider(); };
      $('slider-next').onclick = () => { currentSlide = (currentSlide + 1) % totalSlides; updateSlider(); };
      document.addEventListener('keydown', event => {
        if (!modal.classList.contains('active')) return;
        if (event.key === 'Tab') {
          const buttons = [...modal.querySelectorAll('button:not([disabled])')];
          const first = buttons[0], last = buttons.at(-1);
          if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last?.focus(); }
          else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first?.focus(); }
        }
        if (event.key === 'Escape') closeModal();
        if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
          event.preventDefault();
          currentSlide = (currentSlide + (event.key === 'ArrowLeft' ? -1 : 1) + totalSlides) % totalSlides;
          updateSlider();
        }
      });
      $('btn-grid').onclick = () => {
        if (!viewIsList) return;
        $('btn-grid').classList.add('active'); $('btn-list').classList.remove('active');
        $('btn-grid').setAttribute('aria-pressed', 'true'); $('btn-list').setAttribute('aria-pressed', 'false');
        switchView(false);
      };
      $('btn-list').onclick = () => {
        if (viewIsList) return;
        $('btn-list').classList.add('active'); $('btn-grid').classList.remove('active');
        $('btn-list').setAttribute('aria-pressed', 'true'); $('btn-grid').setAttribute('aria-pressed', 'false');
        switchView(true);
      };
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', loadMaps);
      else loadMaps();
    })();
  </script>
</body>

</html>
